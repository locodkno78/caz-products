<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"      
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"      
    ></script>
    <script src="https://use.fontawesome.com/releases/v5.0.7/js/all.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script type="module" src="../firebase.js"></script>
    <script type="module" src="./home.js"></script>
    <link rel="stylesheet" href="../styles.css">
    <title>Home</title>
</head>
<body>
     <header>
        <nav class="navbar navbar-dark bg-dark">
            <div class="container-fluid">
                <span class="navbar-brand mb-4 h1">CAZ Insumos Industriales</span>
                <div>                    
                    <button class="btn btn-danger" data-bs-toggle="tooltip" title="Cerrar Sesión" type="button"
                        id="logout">
                        <i class="bi bi-box-arrow-right"></i>
                    </button>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <div class="container">
            <div class="header d-flex container-fluid">
                <div class="control">
                    <form class="d-flex" role="search">
                        <input
                            class="form-control"
                            id="searchInput"
                            type="search"
                            placeholder="Buscar producto..."
                        >
                    </form>
                </div>
                <button type="button" class="btn btn-danger" id="openRegisterModal" data-bs-toggle="modal"
                    data-bs-target="#newCustomer">
                    <i class="bi bi-plus"></i><span> Agregar Producto</span></button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover table-bordered" id="table">
                    <!--LOS DATOS SE CARGARÁN DE FORMA DINAMICA-->
                </table>
            </div>
        </div>
    </main>

    <!--Registro de nuevo producto-->
    <div class="modal fade" id="newCustomer" tabindex="-1" aria-labelledby="newCustomerlabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content bg-dark">
                <div class="modal-header bg-dark text-white">
                    <h2 class="modal-title bg-dark text-white">Registrar Nuevo Producto</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="register-form" enctype="multipart/form-data">
                        <div class="field">
                            <label class="label"><strong>Nombre</strong></label>
                            <div class="control">
                                <input class="form-control" name="name" type="text" placeholder="Nombre" required>
                            </div>
                        </div>                        
                        <div class="field">
                            <label class="label"><strong>Categoría</strong></label>
                            <select class="form-select" name="category" aria-label="Default select example">
                                <option selected>Categoría</option>
                                <option value="Alambres">Alambres</option>
                                <option value="Accesorios para Soldadura">Accesorios para Soldadura</option>
                                <option value="Auxiliares de Soldadura">Auxiliares de Soldadura</option>
                                <option value="Calefactores">Calefactores</option>
                                <option value="Cintas">Cintas</option>
                                <option value="Compresores">Compresores</option>
                                <option value="Consumibles">Consumibles</option>
                                <option value="Discos Abrasivos">Discos Abrasivos</option>
                                <option value="Electrodos">Electrodos</option>
                                <option value="Embalajes">Embalajes</option>
                                <option value="Equipos">Equipos</option>
                                <option value="Ferreteria">Ferreteria</option>
                                <option value="Filtros Ciclónicos y Coalescentes">Filtros Ciclónicos y Coalescentes</option>
                                <option value="Gases">Gases</option>
                                <option value="Gomeria">Gomeria</option>
                                <option value="Herramientas de Mano">Herramientas de Mano</option>
                                <option value="Hornos">Hornos</option>
                                <option value="Izajes">Izajes</option>
                                <option value="Paneles Solares">Paneles Solares</option>
                                <option value="Protección Personal">Protección Personal</option>
                                <option value="Reguladores">Reguladores</option>
                                <option value="Resortes">Resortes</option>
                                <option value="Soldadoras">Soldadoras</option>
                                <option value="Sopleteria & Reguladores">Sopleteria & Reguladores</option>
                                <option value="Torchas & Respuestos">Torchas & Respuestos</option>
                                <option value="Varillas de Bronce">Varillas de Bronce</option>
                                <option value="Varillas TIG">Varillas TIG</option>
                                <option value="Viales">Viales</option>
                            </select>
                        </div>
                        <div class="field">
                            <label class="label"><strong>Características</strong></label>
                            <div class="control">
                                <input
                                    class="form-control"
                                    name="characteristics"
                                    type="text"
                                    placeholder="Características del producto"
                                    required
                                />
                                </div>
                            </div>
                        <div class="field">
                                <label class="label"><strong> Cantidad </strong></label>
                                <div class="control">
                                    <input class="form-control" name="quantity" type="number" placeholder="Cantidad" required>
                                </div>
                        </div>                       
                        <div class="field">
                                <label class="label"><strong> Precio </strong></label>
                                <div class="control">
                                    <input class="form-control" name="price" type="number" placeholder="Precio" required>
                                </div>
                        </div>
                        <div class="field">
                                <label class="label"><strong> Imagen 1 (URL) </strong></label>
                                <input class="form-control" name="img" type="text" placeholder="URL de la imagen">
                        </div>
                        <div class="field mt-2">
                                <label class="label"><strong> Imagen 1 (Archivo) </strong></label>
                                <input class="form-control" name="imgFile" type="file" accept="image/*">
                        </div>
                        <div class="field mt-3">
                                <label class="label"><strong> Imagen 2 (URL) </strong></label>
                                <input class="form-control" name="img2" type="text" placeholder="URL de la imagen">
                        </div>
                        <div class="field mt-2">
                                <label class="label"><strong> Imagen 2 (Archivo) </strong></label>
                                <input class="form-control" name="imgFile2" type="file" accept="image/*">
                        </div>                  
                        <div class="modal-footer">
                            <button type="button" id="closeRegisterModal" class="btn btn-danger"
                                data-bs-dismiss="modal">Cerrar</button>
                            <button type="submit" class="btn btn-success" id="submit" data-bs-dismiss="modal">
                            <i class="fas fa-save"></i>
                            <span>Registrar</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>  
        </div>
    </div>

    <!-- Formulario de edición de Producto-->
    <div id="editCustomer" class="modal fade" tabindex="-1" aria-labelledby="editCustomerlabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content bg-dark">
                <div class="modal-header bg-dark text-white">
                    <h2 class="modal-title bg-dark text-white">Editar Producto</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"
                        id="closeModal"></button>
                </div>
                <div class="modal-body">
                    <form id="edit-form">
                        <input type="hidden" id="edit-id" name="edit-id">
                        <div class="field">
                            <label for="edit-name" class="label"><strong> Nombre </strong></label>
                            <div class="control">
                                <input type="text" class="input" name="name" required>
                            </div>
                        </div>
                        <div class="field">
                            <label class="label"><strong>Categoría</strong></label>
                            <select class="form-select" name="category" aria-label="Default select example">
                                <option selected>Categoría</option>
                                <option value="Alambres">Alambres</option>
                                <option value="Herramientas de Mano">Herramientas de Mano</option>
                                <option value="Electrodos">Electrodos</option>
                                <option value="Torchas & Respuestos">Torchas & Respuestos</option>
                                <option value="Compresores">Compresores</option>
                                <option value="Soldadoras">Soldadoras</option>
                                <option value="Sopleteria & Reguladores">Sopleteria & Reguladores</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="edit-characteristics" class="label"><strong> Características </strong></label>
                            <div class="control">
                                <input type="text" class="input" name="characteristics" required>
                            </div>
                        </div>
                        <div class="field">
                            <label for="edit-quantity" class="label"><strong> Cantidad </strong></label>
                            <div class="control">
                                <input type="number" class="input" name="quantity" required>
                            </div>
                        </div> 
                        <div class="field">
                            <label for="edit-price" class="label"><strong> Precio </strong></label>
                            <div class="control">
                                <input type="text" class="input" name="price" required>
                            </div>
                        </div>
                        <div class="field">
                            <label class="label"><strong> Imagen 1 (URL) </strong></label>
                            <input class="form-control" name="img" type="text" placeholder="URL de la imagen">
                        </div>
                        <div class="field mt-2">
                            <label class="label"><strong> Imagen 1 (Archivo) </strong></label>
                            <input class="form-control" name="imgFile" type="file" accept="image/*">
                        </div>
                        <div class="field mt-3">
                            <label class="label"><strong> Imagen 2 (URL) </strong></label>
                            <input class="form-control" name="img2" type="text" placeholder="URL de la imagen">
                        </div>
                        <div class="field mt-2">
                            <label class="label"><strong> Imagen 2 (Archivo) </strong></label>
                            <input class="form-control" name="imgFile2" type="file" accept="image/*">
                        </div>
                        <div class="modal-footer">
                            <button type="button" id="closeEditModal" class="btn btn-danger" data-bs-dismiss="modal"
                                aria-label="close">Cerrar</button>
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-save"></i>
                                <span>Guardar</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Vista de Producto -->
    <div id="viewProduct" class="modal fade" tabindex="-1" aria-labelledby="viewProductlabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content bg-dark text-white">
                <div class="modal-header bg-dark text-white">
                    <h3 class="modal-title">Detalles del Producto</h3>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="content">
                        <p><strong>Nombre:</strong> <span id="view-name"></span></p>
                        <p><strong>Características:</strong> <span id="view-characteristics"></span></p>
                        <p><strong>Cantidad:</strong> <span id="view-quantity"></span></p>
                        <p><strong>Precio:</strong> <span id="view-price"></span></p>                       
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
